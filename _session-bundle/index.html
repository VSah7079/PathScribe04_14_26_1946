<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons. The SVG wins in modern browsers; the .ico covers older ones
         and Windows shortcuts, and carries different artwork per size — a
         simplified mark at 16/24px where fine detail cannot survive, the fuller
         mark from 32px up. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/pathscribe-icon-180.png" />

    <!-- Colours the browser chrome on mobile to match the app surface. -->
    <meta name="theme-color" content="#0b1120" />

    <!-- Product first: tab titles truncate hard, and "ForMedrixAI - PathScribe"
         renders as "ForMedrixAI..." in a narrow tab — cutting exactly the word
         that tells the user which app this is. -->
    <title>PathScribe</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
