# PS-471 (Batch 615): the checks that run on each batch here, run on every change.
# This file only takes effect once the repository is on GitHub (PS-468).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Type check, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  report-renderer:
    name: Report renderer (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/requirements.txt
      - run: pip install -r functions/requirements.txt
      - run: python functions/test_main.py
        working-directory: .
      - run: python functions/test_report_delivery.py
        working-directory: .
